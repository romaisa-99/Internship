        <h1> Comparision Operators in Console </h1>
        <script> 
            var a =10;
            var b ="10";

            console.log(a == b); // it is still true beacuse it is checking whether the values are same, it is not checkig the data type rn
            console.log(a === b); //not checking for the same values and also for the same datatype
            console.log(2 != '2');
            console.log(2 != 2);
            console.log(2 !== '2');
            console.log(2 > '4');
            console.log(2 < '4');
            console.log(2 >= '4');
            console.log(3 <= '4');
            console.log(null == undefined);
            console.log(null === undefined);

            console.clear();
       </script>
