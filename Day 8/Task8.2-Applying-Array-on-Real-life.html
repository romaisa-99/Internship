<html>
    <head>
        <title> Applying Array in Real-Life</title>
    </head>
    <body>
        <script> 
// Situational Question: Student Management System Using Arrays in JavaScript
// Question:
// You are developing a Student Management System for a university. You need to store and manage students' information using JavaScript arrays.
// Each student record should contain:
// •	Student Name 
// •	Marks 
// •	Department 
// •	CGPA 
// Perform the following tasks using arrays:
// 1.	Create an array to store student information. 
// 2.	Take student data from the user using a loop. 
// 3.	Store multiple student records using a multidimensional array. 
// 4.	Display all student records in a table format. 
// 5.	Update a student's information. 
// 6.	Delete unwanted data from the array. 
// 7.	Perform the following operations using array methods: 
// o	Sort student names alphabetically. 
// o	Reverse the order of students. 
// o	Add a new student at the end using push(). 
// o	Remove the last student using pop(). 
// o	Add a new student at the beginning using unshift(). 
// o	Remove the first student using shift(). 
// o	Combine two department arrays using concat(). 
// o	Convert the array into a string using join() and toString(). 
// o	Extract some student records using slice(). 
// o	Insert or remove student records using splice(). 
// 8.	Check whether a given variable is an array or not using Array.isArray(). 
// 9.	Search student records: 
// o	Find the index of a student using indexOf(). 
// o	Find the last occurrence using lastIndexOf(). 
// o	Check if a student exists using includes(). 
// 10.	Apply conditions: 
// •	Check if some students have marks greater than 80 using some(). 
// •	Check if every student has passed using every(). 
// •	Find the first student who scored above 90 using find(). 
// •	Find the index of the first student who scored above 90 using findIndex(). 
// •	Create a new array containing only passed students using filter(). 
// 11.	Display all student names using the forEach() loop.

//Solution
//1.Structure: [Name, Marks, Department, CGPA]

var students = [];

//2. Taking student data
// Number of students
for(var i = 0; i < total; i++)
{
    var name = prompt("Enter Student Name:");
    var marks = Number(prompt("Enter Marks:"));
    var department = prompt("Enter Department:");
    var cgpa = Number(prompt("Enter CGPA:"));

    students.push([name, marks, department, cgpa]);
}

//Create a table
function showTable(title)
{
    document.write("<h2>" + title + "</h2>");
    document.write("<table border='1' cellspacing='0' cellpadding='8'>");

    document.write("<tr>");
    document.write("<th>Name</th>");
    document.write("<th>Marks</th>");
    document.write("<th>Department</th>");
    document.write("<th>CGPA</th>");
    document.write("</tr>");

    for(var i = 0; i < students.length; i++)
    {
        document.write("<tr>");
        for(var j = 0; j < students[i].length; j++)
        {
            document.write("<td>" + students[i][j] + "</td>");
        }
        document.write("</tr>");
    }
    document.write("</table><br>");
}
showTable("Student Records");

//Update a Student's Information
students[0][0] = "Sara";
students[0][1] = 90;
students[0][2] = "BSAI";
students[0][3] = 3.9;
showTable("After Updating Student");

// Delete student Record
students.splice(1,1);
showTable("After Deleting Student");

//Perform Array Methods

students.sort();
showTable("After Sort()");

students.reverse();
showTable("After Reverse()");

students.push(["Ali",92,"BSIT",3.8]);
showTable("After Push()");

students.pop();
showTable("After Pop()");

students.unshift(["Hamza",85,"BBA",3.4]);
showTable("After Unshift()");

students.shift();
showTable("After Shift()");


var dept1 = ["BSSE","BSCS"];
var dept2 = ["BBA","BSFINTECH"];
var departments = dept1.concat(dept2);
document.write("<h3>Concat()</h3>");
document.write(departments + "<br><br>");

document.write("<h3>Join()</h3>");
document.write(departments.join(" - "));
document.write("<br><br>");

document.write("<h3>toString()</h3>");
document.write(departments.toString());
document.write("<br><br>");

//slice()
var newStudents = students.slice(0,2);

document.write("<h3>Slice()</h3>");
document.write("<table border='1' cellspacing='0' cellpadding='8'>");

document.write("<tr>");
document.write("<th>Name</th>");
document.write("<th>Marks</th>");
document.write("<th>Department</th>");
document.write("<th>CGPA</th>");
document.write("</tr>");

for(var i = 0; i < newStudents.length; i++)
{
    document.write("<tr>");

    for(var j = 0; j < newStudents[i].length; j++)
    {
        document.write("<td>" + newStudents[i][j] + "</td>");
    }

    document.write("</tr>");
}
document.write("</table><br>");

//splice()
students.splice(1,0,["Ayesha",91,"BSAI",3.7]);
showTable("After Splice()");

//Check if It Is an Array
document.write("<h3>Array.isArray()</h3>");
if(Array.isArray(students))
{
    document.write("students is an Array");
}
else
{
    document.write("students is not an Array");
}
document.write("<br><br>");

//Create Student Names Array
var studentNames = [];
for(var i = 0; i < students.length; i++)
{
    studentNames.push(students[i][0]);
}

//indexOf()
document.write("<h3>indexOf()</h3>");
document.write(studentNames.indexOf("Sara"));
document.write("<br><br>");

//lastIndexOf()
studentNames.push("Sara");
document.write("<h3>lastIndexOf()</h3>");
document.write(studentNames.lastIndexOf("Sara"));
document.write("<br><br>");

//includes()
document.write("<h3>includes()</h3>");
if(studentNames.includes("Sara"))
{
    document.write("Sara exists in the array.");
}
else
{
    document.write("Student not found.");
}
document.write("<br><br>");

//some()
var result = students.some(function(student)
{
    return student[1] > 80;
});
document.write("<h3>some()</h3>");
document.write(result + "<br><br>");

//every()
var result = students.every(function(student)
{
    return student[1] >= 50;
});
document.write("<h3>every()</h3>");
document.write(result + "<br><br>");

//find()
var topper = students.find(function(student)
{
    return student[1] > 90;
});
document.write("<h3>find()</h3>");
document.write(topper + "<br><br>");

//findIndex()
var index = students.findIndex(function(student)
{
    return student[1] > 90;
});
document.write("<h3>findIndex()</h3>");
document.write(index + "<br><br>");

//filter()
var passed = students.filter(function(student)
{
    return student[1] >= 50;
});

document.write("<h3>Passed Students</h3>");

document.write("<table border='1' cellspacing='0' cellpadding='8'>");

document.write("<tr>");
document.write("<th>Name</th>");
document.write("<th>Marks</th>");
document.write("<th>Department</th>");
document.write("<th>CGPA</th>");
document.write("</tr>");
for(var i = 0; i < passed.length; i++)
{
    document.write("<tr>");
    for(var j = 0; j < passed[i].length; j++)
    {
        document.write("<td>" + passed[i][j] + "</td>");
    }
    document.write("</tr>");
}
document.write("</table><br>");

//Display Student Names Using forEach()
document.write("<h3>Student Names</h3>");
studentNames.forEach(function(name,index)
{
    document.write((index + 1) + ". " + name + "<br>");
});

        </script>
    </body>
</html>
