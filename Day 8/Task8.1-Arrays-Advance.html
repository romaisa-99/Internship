//some() - atlesat one or more than one need to be indlued
document.write("<h3> Some(): </h3>");
 var marks = [35, 42, 78, 90];
document.write(marks + "<br>");

var result = marks.some(checkPass);
document.write(result + "<br><br>");

function checkPass(mark) {
    return mark >= 50;
}

//every() - all the values need to be true
var marks = [65, 72, 88, 91];
document.write(marks + "<br><br>");

var result = marks.every(checkPass);
document.write(result + "<br><br>");

function checkPass(mark) {
    return mark >= 50;
}

//find()
document.write("<h3> find() </h3>");
var prices = [120, 250, 80, 300];
document.write(prices + "<br>");

var result = prices.find(checkPrice);
document.write(result + "<br><br>");

function checkPrice(price) {
    return price > 200;
}


//findIndex() - it prints the index number of the very first value that fulfils the condition.
document.write("<h3> findIndex() </h3>");
var prices = [120, 25, 800, 300];
document.write(prices + "<br>");

var result = prices.findIndex(checkPrice);
document.write(result + "<br><br>");

function checkPrice(price) {
    return price > 200;
}

//filter() - it will create a new array based on the condition provided. 
document.write("<h3> filter() </h3>");

document.write(prices + "<br>");

var result = prices.filter(checkPrice);
document.write(result + "<br><br>");

function checkPrice(price) {
    return price > 200;
}
