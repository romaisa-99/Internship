
<!DOCTYPE html>
<html>
<head>
    <title>Offset Top & Left</title>

    <style>
        #box {
            background: pink;
            width: 300px;
            height: 300px;
            border: 1px solid #000;
            margin-top: 50px;
            margin-left: 100px;
        }
    </style>
</head>
<body>

    <h2>JavaScript offsetTop & offsetLeft</h2>

    <div id="box">
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Molestiae harum non, vel quaerat beatae, corporis ipsum
        delectus deserunt laborum sint rerum?
    </div>

    <script>
        var target = document.querySelector("#box");

        console.log("offsetTop: " + target.offsetTop);
        console.log("offsetLeft: " + target.offsetLeft);
    </script>

</body>
</html>
