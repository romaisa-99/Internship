<!DOCTYPE html>
<html>
<head>
    <title>ScrollWidth and ScrollHeight</title>

    <style>
        body {
            font-family: Arial;
        }

        #box {
            background: pink;
            width: 300px;
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
            overflow: auto;
        }

        #inner-box {
            width: 600px;
            height: 100px;
            background: lightgreen;
        }
    </style>
</head>
<body>

    <h2>JavaScript scrollWidth & scrollHeight</h2>

    <div id="box">
        <div id="inner-box"></div>

        Lorem ipsum dolor, sit amet consectetur adipisicing elit.
        Quis, debitis? Labore unde cumque nisi dignissimos quis
        autem nobis ex. Lorem ipsum dolor sit amet consectetur
        adipisicing elit. Quisquam, doloremque.
    </div>

    <script>
        var target = document.querySelector("#box");

        var scroll_width = target.scrollWidth;
        var scroll_height = target.scrollHeight;

        console.log("Scroll Width: " + scroll_width);
        console.log("Scroll Height: " + scroll_height);
    </script>

</body>
</html>
