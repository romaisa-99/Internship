
<!DOCTYPE html>
<html>
<head>
    <title>ClientWidth & ClientHeight</title>

    <style>
        body {
            font-family: Arial;
        }

        #box {
            background: orange;
            width: 300px;
            height: 300px;
            border: 10px solid black;
            padding: 10px;
            margin: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>

    <h2>JavaScript clientWidth & clientHeight</h2>

    <div id="box">
        Vestibulum at imperdiet ante. Suspendisse lorem erat,
        pellentesque id gravida et, varius id arcu. Sed lectus
        lectus, convallis id tempor ac, laoreet ut elit.
        Duis bibendum et felis ac posuere. Aenean non finibus ex,
        in feugiat nibh.
    </div>

    <script>
        var target = document.querySelector("#box");

        var width = target.clientWidth;
        var height = target.clientHeight;

        console.log("clientWidth: " + width);
        console.log("clientHeight: " + height);
    </script>

</body>
</html>
