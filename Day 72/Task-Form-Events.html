<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Task</title>
    <link rel="stylesheet" href="Task-Form-Events.css">
</head>

<body>

<div class="form-box">

    <form>

        <h2>Contact Form</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" onkeydown="keydownFunction(this)" placeholder="Enter your Name.." required>

        <br>
        <br>

        <label for="email">Email:</label>
        <input type="text" id="email"  placeholder="Enter your Email.." required>
        
        <br>
        <br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" onkeyup="keyupFunction(this)" placeholder="Enter your Phone..">
        
        <br>
        <br>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your Age..">
        
        <br>
        <br>

        <label for="gender"> Gender: </label>
        <select id="gender" onchange="changeFunction(this)">
            <option value=""> Select </option>
            <option value="male"> Male </option>
            <option value="female"> Female </option>
            <option value="other"> Other </option>
        </select>
        
        <br>
        <br>

        <label for="subject"> Subject: </label>
        <input type="text" id="subject" onfocus="focusFunction()" onblur="blurFunction()" oninput="inputFunction(this)" placeholder="Enter Subject..">
        
        <br><br>

        <label for="message"> Message: </label>
        <textarea id="message" rows="4" placeholder="Write your message.."></textarea>
       
        <br>
        <br>

        <label for="rating">Rating (1 to 10):</label><br>
        <input type="range" id="rating" min="1" max="10" value="5">
        
        <br>
        <br>

        <label class="checkbox-label">
            <input type="checkbox" required> I agree to the terms and conditions
        </label>

        <br>
        <br>

        <button type="submit">Submit </button>

    </form>

</div>
 <div> <h2> You are Typing.. </h2> </div>

<div id="display" style="border:1px solid lightgray; padding:10px; margin-top:20px;">
   
</div>
<script src="Task-Form-Events.js"></script>

</body>
</html>
