<html>
    <head>
        <title> Even and Odd Numbers</title>
    </head>
    <script>

        document.write("<h3> Even Numbers </h3>");
        for(var a=1; a<=50;a++){
            if (a % 2 == 0 ){
                document.write(a + "<br>");
            }
        }
         document.write("<br>");
         document.write("<h3> Odd Numbers </h3>" );

        for(var a=1; a<=50;a++){
            if (a % 2 !== 0 ){
                document.write(a + "<br>");
            }
        }
    </script>
    <body>
        
    </body>
</html>
