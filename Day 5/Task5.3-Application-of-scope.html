<html>
    <head>
        <title> Application of Scope </title>
    </head>
    <body>
        <script>
            document.write("<h3> Application of Scope: </h3>")

            
            //Global Scope
            let studentName = "Aleena";
            let marks = 85;

            function showStudent()
            {
                console.log("Student Name: " + studentName );
                console.log("Marks: " + marks );
            }
            showStudent();
            console.log("Student Name: " + studentName );
            console.log("Marks: " + marks );

            //Function(Local) Scope
            //if the declaration is dones inside the function and is being called outside the function it will give us an error.

        </script>
    </body>
</html>
