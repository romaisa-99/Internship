<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Array</title>
</head>
<body>

<script>

var fruits = ["Apple", "Banana", "Mango", "Orange"];
document.write(fruits + "<br>");

//Accessing Array Elements
var fruits = ["Apple", "Banana", "Mango", "Orange"];
document.write(fruits[0] + "<br>");
document.write(fruits[1] + "<br>");
document.write(fruits[2] + "<br>");
document.write(fruits[3] + "<br>");

//Displaying All Elements Using a Loop
var students = ["Ali", "Sara", "Ahmed", "Ayesha", "Hassan"];

for(var i = 0; i < students.length; i++)
{
    document.write(students[i] + "<br>");
}

//Updating an Array Element
var colors = ["Red", "Green", "Blue"];

colors[1] = "Yellow";

for(var i = 0; i < colors.length; i++)
{
    document.write(colors[i] + "<br>");
}

//Adding Elements
var numbers = [10, 20, 30];

numbers.push(40);
numbers.push(50);

for(var i = 0; i < numbers.length; i++)
{
    document.write(numbers[i] + "<br>");
}

//Array Methods
var fruits = ["Apple", "Banana", "Mango"];

document.write("<h3>Original Array</h3>");
document.write(fruits + "<br><br>");

document.write("<h3>1. push() - Add at End</h3>");
fruits.push("Orange");
document.write(fruits + "<br><br>");

document.write("<h3>2. pop() - Remove Last Element</h3>");
fruits.pop();
document.write(fruits + "<br><br>");

document.write("<h3>3. unshift() - Add at Beginning</h3>");
fruits.unshift("Grapes");
document.write(fruits + "<br><br>");

document.write("<h3>4. shift() - Remove First Element</h3>");
fruits.shift();
document.write(fruits + "<br><br>");

document.write("<h3>5. length - Total Elements</h3>");
document.write("Length = " + fruits.length + "<br><br>");

document.write("<h3>6. indexOf()</h3>");
document.write("Index of Mango = " + fruits.indexOf("Mango") + "<br><br>");

document.write("<h3>7. includes()</h3>");
document.write(fruits.includes("Banana") + "<br><br>");

document.write("<h3>8. reverse()</h3>");
fruits.reverse();
document.write(fruits + "<br><br>");

document.write("<h3>9. sort()</h3>");
fruits.sort();
document.write(fruits + "<br><br>");

document.write("<h3>10. join()</h3>");
document.write(fruits.join(" - ") + "<br><br>");

document.write("<h3>11. slice()</h3>");
var newFruits = fruits.slice(1, 3);
document.write(newFruits + "<br><br>");

document.write("<h3>12. splice()</h3>");
fruits.splice(1, 1, "Kiwi", "Peach");
document.write(fruits + "<br><br>");

document.write("<h3>13. concat()</h3>");
var moreFruits = ["Cherry", "Guava"];
var allFruits = fruits.concat(moreFruits);
document.write(allFruits + "<br><br>");

document.write("<h3>14. toString()</h3>");
document.write(allFruits.toString() + "<br><br>");

document.write("<h3>15. Using Loop</h3>");
for(var i = 0; i < allFruits.length; i++)
{
    document.write(allFruits[i] + "<br>");
}

//Array Constructor
//A constructor is a special function that is used to create a new object or thing.
var ary = new Array();

ary[0] = 10;
ary[1] = "Aleenan";
ary[2] = 45.5;
ary[3] = true;

document.write("<ul>");
for(var a = 0; a < ary.length; a++)
{
    document.write("<li>" + ary[a] + "</li>");
}
document.write("</ul>");

</script>

</body>
</html>
